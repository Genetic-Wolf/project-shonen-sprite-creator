name: Build Windows Artist Edition
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  validate-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
      - name: Validate canonical repository
        run: python verify_repository.py
      - name: Compile Python source
        run: python -c "import pathlib,py_compile; [py_compile.compile(str(p),doraise=True) for p in pathlib.Path('.').glob('*.py')]"
      - name: Validate JSON
        run: python -c "import pathlib,json; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('.').glob('*.json')]"
      - name: Source self-test
        env:
          PROJECT_SHONEN_DATA: ${{ runner.temp }}\ProjectShonenSourceTest
        run: python ProjectShonenSpriteCreator.py --self-test
      - name: Build Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name ProjectShonenSpriteCreator --hidden-import PIL._tkinter_finder --add-data "assets;assets" --add-data "masters;masters" --add-data "templates;templates" --add-data "ui_thumbnails;ui_thumbnails" --add-data "library.json;." --add-data "master_registry.json;." --add-data "asset_outputs.json;." ProjectShonenSpriteCreator.py
      - name: Compiled EXE self-test
        shell: pwsh
        env:
          PROJECT_SHONEN_DATA: ${{ runner.temp }}\ProjectShonenExeTest
        run: |
          Remove-Item "$env:PROJECT_SHONEN_DATA\self_test_result.json" -ErrorAction SilentlyContinue
          Start-Process -FilePath ".\dist\ProjectShonenSpriteCreator\ProjectShonenSpriteCreator.exe" -ArgumentList "--self-test" -Wait
          $resultPath = "$env:PROJECT_SHONEN_DATA\self_test_result.json"
          if (!(Test-Path $resultPath)) { throw "Compiled EXE did not produce self-test result" }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if ($result.ok -ne $true) { throw "Compiled EXE self-test reported failure" }

      - name: Assemble clean Artist Edition
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artist-edition" | Out-Null
          Copy-Item "dist\ProjectShonenSpriteCreator\*" "artist-edition" -Recurse
          Copy-Item "README.txt" "artist-edition\README.txt"
      - name: Reject development clutter
        shell: pwsh
        run: |
          $bad = Get-ChildItem "artist-edition" -Recurse -File | Where-Object { $_.Extension -in ".py",".pyc",".spec",".bat" -or $_.Name -match "RELEASE_NOTES|AUDIT_REPORT|BUILD_STATUS" }
          if ($bad) { $bad | ForEach-Object { Write-Host $_.FullName }; throw "Artist Edition contains development files" }
          if (!(Test-Path "artist-edition\ProjectShonenSpriteCreator.exe")) { throw "Artist executable missing" }
      - name: Create single Windows ZIP
        shell: pwsh
        run: Compress-Archive -Path "artist-edition\*" -DestinationPath "Project-Shonen-Sprite-Creator-v0.22.0-Windows.zip" -Force
      - name: Upload Windows Artist Edition
        uses: actions/upload-artifact@v4
        with:
          name: Project-Shonen-Sprite-Creator-v0.22.0-Windows
          path: Project-Shonen-Sprite-Creator-v0.22.0-Windows.zip
          if-no-files-found: error
