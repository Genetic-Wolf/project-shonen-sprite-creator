name: Build Windows Artist Edition

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python for build machine
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
      - name: Validate source exists
        shell: pwsh
        run: |
          if (!(Test-Path "ProjectShonenSpriteCreator.py")) { throw "ProjectShonenSpriteCreator.py is missing" }
      - name: Build self-contained Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name ProjectShonenSpriteCreator --hidden-import PIL._tkinter_finder ProjectShonenSpriteCreator.py
      - name: Assemble Artist Edition
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artist-edition" | Out-Null
          Copy-Item "dist\ProjectShonenSpriteCreator\*" "artist-edition" -Recurse
          if (Test-Path "README.txt") { Copy-Item "README.txt" "artist-edition\README.txt" }
          @("assets","masters","templates","ui_thumbnails") | ForEach-Object {
            if (Test-Path $_) { Copy-Item $_ "artist-edition\$_" -Recurse }
          }
          @("master_registry.json","library.json","rpgmaker_export_map.json","WINDOWS_DISTRIBUTION_MANIFEST.json") | ForEach-Object {
            if (Test-Path $_) { Copy-Item $_ "artist-edition\$_" }
          }
          @("character_projects","artist_workspace","exports","backups") | ForEach-Object {
            New-Item -ItemType Directory -Force "artist-edition\$_" | Out-Null
          }
      - name: Upload Windows Artist Edition
        uses: actions/upload-artifact@v4
        with:
          name: Project-Shonen-Sprite-Creator-Windows
          path: artist-edition
          if-no-files-found: error
